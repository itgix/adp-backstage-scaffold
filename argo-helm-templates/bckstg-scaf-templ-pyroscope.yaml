apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: pyroscope
  title: Grafana Pyroscope
  description: Installs Grafana Pyroscope as an optional platform tool into the environment's applications GitOps repository. Adds the Pyroscope wrapper chart and its ArgoCD Application, then opens a pull or merge request. Object storage and the service-account identity are configured per environment in the generated per-environment values file.
  tags:
    - pyroscope
    - profiling
    - observability
    - platform-tool
spec:
  owner: platform-team
  type: platform-tool

  parameters:
    - title: Pyroscope placement
      required: [stage, region]
      properties:
        stage:
          title: On which stage to deploy
          type: string
          description: Stage (e.g., 'dev' or 'staging' or 'prod').
        region:
          title: On which region will Pyroscope run
          type: string
          description: The cloud region (e.g., 'ca-central-1').
        namespace:
          title: Kubernetes namespace
          type: string
          description: Namespace Pyroscope is deployed into.
          default: monitoring
    - title: Git provider
      properties:
        git_provider:
          title: Git provider of the applications repository
          type: string
          enum: [github, gitlab]
          default: github

  steps:
    - id: fetch-base
      name: Fetch and Render Template
      action: fetch:template
      input:
        url: ./skeleton-pyroscope/
        targetPath: ./helm/
        values:
          stage: ${{ parameters.stage }}
          region: ${{ parameters.region }}
          namespace: ${{ parameters.namespace }}

    - id: rename-dirs
      name: Rename the directories with the proper region and stage
      action: fs:rename
      input:
        files:
        # 1) deepest files FIRST (strip .hbs)
        - from: helm/pyroscope/values/STAGE/REGION/values.yaml.hbs
          to: helm/pyroscope/values/STAGE/REGION/values.yaml

        - from: helm/pyroscope/values.yaml.hbs
          to: helm/pyroscope/values.yaml

        - from: helm/pyroscope/Chart.yaml.hbs
          to: helm/pyroscope/Chart.yaml

        # 2) argocd application template (already outside the pyroscope chart)
        - from: helm/applications/templates/argocd-application-templ.yaml.hbs
          to: helm/applications/templates/application-pyroscope.yaml

        # 3) REGION directory
        - from: helm/pyroscope/values/STAGE/REGION
          to: helm/pyroscope/values/STAGE/${{ parameters.region }}

        # 4) STAGE directory
        - from: helm/pyroscope/values/STAGE
          to: helm/pyroscope/values/${{ parameters.stage }}

    - id: create-pull-request
      name: Create Feature Branch and Pull Request
      if: ${{ parameters.git_provider == 'github' }}
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?owner=${{ environment.secrets.repoOwner }}&repo=${{ environment.secrets.repoName }}'
        branchName: 'feat/pyroscope'
        title: 'New platform tool: Pyroscope'
        sourcePath: .
        description: |
          This PR adds Grafana Pyroscope as an optional platform tool for stage ${{ parameters.stage }}, region ${{ parameters.region }}.

          Before Pyroscope can store data, configure object storage and the
          service-account identity for this environment in
          `helm/pyroscope/values/${{ parameters.stage }}/${{ parameters.region }}/values.yaml`
          (uncomment the AWS or GCP block in that file).

    - id: create-merge-request
      name: Create Feature Branch and Merge Request
      if: ${{ parameters.git_provider == 'gitlab' }}
      action: publish:gitlab:merge-request
      input:
        repoUrl: 'gitlab.itgix.com?owner=${{ environment.secrets.repoOwner }}&repo=${{ environment.secrets.repoName }}'
        branchName: 'feat/pyroscope'
        targetBranchName: 'main'
        title: 'New platform tool: Pyroscope'
        sourcePath: .
        description: |
          This MR adds Grafana Pyroscope as an optional platform tool for stage ${{ parameters.stage }}, region ${{ parameters.region }}.

          Before Pyroscope can store data, configure object storage and the
          service-account identity for this environment in
          `helm/pyroscope/values/${{ parameters.stage }}/${{ parameters.region }}/values.yaml`
          (uncomment the AWS or GCP block in that file).

  output:
    links:
      - title: Review the Pull Request and merge to apply changes
        if: ${{ parameters.git_provider == 'github' }}
        url: ${{ steps['create-pull-request'].output.remoteUrl }}
      - title: Review the Merge Request and merge to apply changes
        if: ${{ parameters.git_provider == 'gitlab' }}
        url: ${{ steps['create-merge-request'].output.mergeRequestUrl }}
