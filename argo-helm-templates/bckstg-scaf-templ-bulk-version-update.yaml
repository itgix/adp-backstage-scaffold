apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: bulk-application-version-update
  title: Bulk Update Application Versions
  description: |
    Tick the applications you want to release, type the new container image tag for
    each of them and pick the target stage. The automation reads the matching Helm
    values file from the GitOps repository, updates `deployment.image.tag`, pushes
    the change on a new branch and opens a merge request against main.
  tags:
    - argocd
    - gitops
    - helm
    - version-bump
    - release

spec:
  owner: platform-team
  type: gitops-config
  lifecycle: experimental

  parameters:
    # ---------------------------------------------------------------------------
    # STEP 1: applications and their new versions.
    #
    # Every application is its own object property so the form shows the real
    # application name as the section label (an `array` would render generic
    # "Application 1 / Application 2" headers instead).
    #
    # CONFIGURABLE: to add an application, copy one block below and change the
    # property name + title, then add it to the `guard-nothing-selected` step.
    # The property name must match the directory name under the Helm charts
    # directory in the GitOps repository.
    # ---------------------------------------------------------------------------
    - title: Applications and versions
      description: |
        Tick "Update" for every application you want to release and fill in the new
        image tag next to it. Applications left unticked are ignored, their version
        field can stay empty.
      properties:
        applications:
          title: Applications
          type: object
          properties:
            # Each block is spelled out in full on purpose: YAML anchors/merge
            # keys are not guaranteed to be expanded by the parser reading this
            # template, and a silently half-expanded schema would break the form.
            phoenix-bridge:
              title: phoenix-bridge
              type: object
              properties:
                selected:
                  title: Update
                  type: boolean
                  default: false
                version:
                  title: New image tag
                  type: string
                  description: 'e.g. v0.1.34'
                  maxLength: 128
                  ui:placeholder: 'required when Update is ticked'
              # VALIDATION: a ticked application must carry a non-empty, well
              # formed image tag. Unticked entries stay unconstrained.
              if:
                properties:
                  selected:
                    const: true
                required: [selected]
              then:
                properties:
                  version:
                    type: string
                    minLength: 1
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
                required: [version]

            phoenix-coreflow:
              title: phoenix-coreflow
              type: object
              properties:
                selected:
                  title: Update
                  type: boolean
                  default: false
                version:
                  title: New image tag
                  type: string
                  description: 'e.g. v0.1.34'
                  maxLength: 128
                  ui:placeholder: 'required when Update is ticked'
              if:
                properties:
                  selected:
                    const: true
                required: [selected]
              then:
                properties:
                  version:
                    type: string
                    minLength: 1
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
                required: [version]

            phoenix-gateway:
              title: phoenix-gateway
              type: object
              properties:
                selected:
                  title: Update
                  type: boolean
                  default: false
                version:
                  title: New image tag
                  type: string
                  description: 'e.g. v0.1.34'
                  maxLength: 128
                  ui:placeholder: 'required when Update is ticked'
              if:
                properties:
                  selected:
                    const: true
                required: [selected]
              then:
                properties:
                  version:
                    type: string
                    minLength: 1
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
                required: [version]

            phoenix-orbit:
              title: phoenix-orbit
              type: object
              properties:
                selected:
                  title: Update
                  type: boolean
                  default: false
                version:
                  title: New image tag
                  type: string
                  description: 'e.g. v0.1.34'
                  maxLength: 128
                  ui:placeholder: 'required when Update is ticked'
              if:
                properties:
                  selected:
                    const: true
                required: [selected]
              then:
                properties:
                  version:
                    type: string
                    minLength: 1
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
                required: [version]

            phoenix-router:
              title: phoenix-router
              type: object
              properties:
                selected:
                  title: Update
                  type: boolean
                  default: false
                version:
                  title: New image tag
                  type: string
                  description: 'e.g. v0.1.34'
                  maxLength: 128
                  ui:placeholder: 'required when Update is ticked'
              if:
                properties:
                  selected:
                    const: true
                required: [selected]
              then:
                properties:
                  version:
                    type: string
                    minLength: 1
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
                required: [version]

            connector-token:
              title: connector-token
              type: object
              properties:
                selected:
                  title: Update
                  type: boolean
                  default: false
                version:
                  title: New image tag
                  type: string
                  description: 'e.g. v0.1.15'
                  maxLength: 128
                  ui:placeholder: 'required when Update is ticked'
              if:
                properties:
                  selected:
                    const: true
                required: [selected]
              then:
                properties:
                  version:
                    type: string
                    minLength: 1
                    pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
                required: [version]

    # ---------------------------------------------------------------------------
    # STEP 2: where to apply the change
    # ---------------------------------------------------------------------------
    - title: Target environment
      required: [stage, region]
      properties:
        stage:
          title: Stage
          type: string
          # The values below are the directory names used in the GitOps repository
          # under <app>/values/<STAGE>/<REGION>/values.yaml - "stg", not "staging".
          # NOTE: only stg/dus6 exists today; prod will only work once the
          # values/prod/<region>/values.yaml files are added to the repository.
          enum:
            - stg
            - prod
          enumNames:
            - Staging
            - Production
          default: stg

        region:
          title: Region
          type: string
          # CONFIGURABLE: region directory inside the values hierarchy.
          enum:
            - dus6
          enumNames:
            - 'Düsseldorf (dus6)'
          default: dus6

        changeReference:
          title: Reason / ticket reference (optional)
          type: string
          description: Added to the merge request description for traceability.
          maxLength: 200
          ui:placeholder: 'e.g. OPS-1234 or "weekly release"'

  steps:
    # ---------------------------------------------------------------------------
    # Guard rails.
    #
    # The scaffolder has no dedicated "fail" action, so these steps point
    # `fetch:plain` at a path that does not exist: the action raises
    # NotFoundError and the task stops with the step name explaining why.
    # ---------------------------------------------------------------------------
    - id: guard-nothing-selected
      name: 'VALIDATION FAILED: no application was selected'
      # CONFIGURABLE: extend this list when adding an application above.
      if: >-
        ${{ not (parameters.applications['phoenix-bridge'].selected
              or parameters.applications['phoenix-coreflow'].selected
              or parameters.applications['phoenix-gateway'].selected
              or parameters.applications['phoenix-orbit'].selected
              or parameters.applications['phoenix-router'].selected
              or parameters.applications['connector-token'].selected) }}
      action: fetch:plain
      input:
        url: ./validation-error/no-application-was-selected

    # Backstop for the form validation above: with `each` the `if` condition is
    # evaluated once per iteration, so this fires for any ticked application that
    # still has an empty version.
    - id: guard-missing-version
      name: 'VALIDATION FAILED: selected application without a version'
      each: ${{ parameters.applications }}
      if: ${{ each.value.selected and not each.value.version }}
      action: fetch:plain
      input:
        url: ./validation-error/selected-application-without-a-version

    - id: log-plan
      name: Log the planned changes
      action: debug:log
      input:
        message: |
          Target: ${{ parameters.stage }} / ${{ parameters.region }}
          Reference: ${{ parameters.changeReference }}
          Updating deployment.image.tag for:
          {% for app, cfg in parameters.applications %}{% if cfg.selected %}  - ${{ app }} -> ${{ cfg.version }}
          {% endif %}{% endfor %}

    # ---------------------------------------------------------------------------
    # Checkout: read only the values files that are going to change, so the
    # resulting commit touches nothing else in the repository.
    #
    # The repository coordinates come from the scaffolder environment secrets
    # (same convention as the other templates in this repo) and fall back to the
    # Phoenix GitOps repository when they are not configured.
    # ---------------------------------------------------------------------------
    - id: fetch-values-files
      name: Fetch values file from the GitOps repository
      each: ${{ parameters.applications }}
      if: ${{ each.value.selected }}
      action: fetch:plain:file
      input:
        url: >-
          https://${{ environment.secrets.repoHost | default('gitlab.phoenix.net-digital.com') }}/${{
          environment.secrets.repoOwner | default('phoenix/infrastructure') }}/${{
          environment.secrets.repoName | default('phnx-argo-apps') }}/-/blob/${{
          environment.secrets.repoBranch | default('main') }}/helm/${{ each.key }}/values/${{
          parameters.stage }}/${{ parameters.region }}/values.yaml
        targetPath: ./helm/${{ each.key }}/values/${{ parameters.stage }}/${{ parameters.region }}/values.yaml

    # ---------------------------------------------------------------------------
    # Edit: rewrite deployment.image.tag in place.
    #
    # Requires @roadiehq/scaffolder-backend-module-utils in the backend.
    # A targeted regex is used instead of a YAML parse/serialize round trip so
    # that comments, quoting and formatting survive and the merge request diff is
    # a single line per application.
    #
    # The pattern walks deployment: -> image: -> the first tag: below it, so
    # unrelated tag: keys elsewhere in the file are left alone. Note that the
    # action compiles the expression with the `g` flag only (no `m`), hence the
    # explicit \n handling instead of ^/$ anchors.
    # ---------------------------------------------------------------------------
    - id: update-image-tag
      name: Update deployment.image.tag
      each: ${{ parameters.applications }}
      if: ${{ each.value.selected }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./helm/${{ each.key }}/values/${{ parameters.stage }}/${{ parameters.region }}/values.yaml
            matchRegex: true
            find: '(deployment:\s*\n(?:[^\n]*\n)*?\s*image:\s*\n(?:[^\n]*\n)*?\s+tag:\s*)[^\n]*'
            replaceWith: '$1"${{ each.value.version }}"'

    # ---------------------------------------------------------------------------
    # Deliver: commit the changed files on a branch unique to this task and open
    # a merge request against the target branch.
    # `commitAction: auto` updates existing files and skips identical ones.
    # ---------------------------------------------------------------------------
    - id: create-merge-request
      name: Push branch and open merge request
      action: publish:gitlab:merge-request
      input:
        repoUrl: >-
          ${{ environment.secrets.repoHost | default('gitlab.phoenix.net-digital.com') }}/?owner=${{
          environment.secrets.repoOwner | default('phoenix/infrastructure') }}&repo=${{
          environment.secrets.repoName | default('phnx-argo-apps') }}
        branchName: 'bump/${{ parameters.stage }}-${{ task.id }}'
        targetBranchName: ${{ environment.secrets.repoBranch | default('main') }}
        title: 'chore(${{ parameters.stage }}): bump application image tags'
        sourcePath: .
        commitAction: auto
        removeSourceBranch: true
        description: |
          Automated image tag bump for **${{ parameters.stage }}** / **${{ parameters.region }}**.

          | Application | New image tag |
          | --- | --- |
          {% for app, cfg in parameters.applications %}{% if cfg.selected %}| `${{ app }}` | `${{ cfg.version }}` |
          {% endif %}{% endfor %}

          {% if parameters.changeReference %}Reference: ${{ parameters.changeReference }}{% endif %}

          Created by the *Bulk Update Application Versions* Backstage template.

  output:
    links:
      - title: Review the merge request and merge to deploy
        url: ${{ steps['create-merge-request'].output.mergeRequestUrl }}
    text:
      - title: Image tags updated
        content: |
          Stage **${{ parameters.stage }}**, region **${{ parameters.region }}**.

          {% for app, cfg in parameters.applications %}{% if cfg.selected %}- `${{ app }}` -> `${{ cfg.version }}`
          {% endif %}{% endfor %}

          **Next steps:**
          1. Review the merge request diff - it should contain one changed line per application.
          2. Merge it; ArgoCD picks the change up on the next sync and rolls out the new tags.
