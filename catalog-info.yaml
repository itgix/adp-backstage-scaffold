apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: adp-catalog-applications
  description: Optional platform applications installable from the Backstage catalog (DevLake, Pyroscope, Alloy, ...). The scaffolder forms are registered separately.
spec:
  type: url
  targets:
    - ./argo-helm-templates/bckstg-scaf-templ-devlake.yaml
    - ./argo-helm-templates/bckstg-scaf-templ-pyroscope.yaml
    - ./argo-helm-templates/bckstg-scaf-templ-alloy.yaml
